name: Build Android APK - Clean

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # لا نستخدم الـ cache هنا لتجنب المشاكل المؤقتة

      - name: 3. Generate Wrapper & Build APK
        run: |
          echo "------ TAWLEED GRADLE WRAPPER ------"
          # نقوم بتوليد ملف gradlew الناقص داخل السيرفر
          gradle wrapper
          chmod +x gradlew
          echo "------ BINA'A AL-APK ------"
          # أمر البناء المباشر
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 4. Upload APK (Tahaqqoq)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
